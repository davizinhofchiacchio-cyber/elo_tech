<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Tech</title>
    <style>
        /* (Aqui vai o seu CSS que já ajustamos) */
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0a0a0a; color: #e2e2e2; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 15px 60px 15px; }
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; }
        header { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 20px 0; z-index: 100; }
        .logo-img { width: 100%; max-width: 220px; height: auto; object-fit: contain; border-radius: 12px; }
        h1 { font-size: 2.2rem; color: #ffffff; letter-spacing: 2px; margin-top: 15px; }
        .highlight { color: #00c8ff; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 25px; margin-top: 25px; }
        .card { width: 100%; background: #121212; border: 1px solid #222; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h2 { font-size: 1.8rem; margin-bottom: 15px; border-left: 4px solid #00c8ff; padding-left: 12px; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
        .team-member { background: #1a1a1a; padding: 15px; border-radius: 8px; display: flex; align-items: center; border: 1px solid #333; }
        .team-member i { color: #00c8ff; font-size: 1.2rem; margin-right: 12px; }
    </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/davizinhofchiacchio-cyber/projeto-aletheia/main/logo.jpeg" alt="Logo Elo Tech" class="logo-img">
  </div>
  <h1>ELO TECH</h1>
</header>

<div class="container">
    <section class="card">
        <h2>Nossa <span class="highlight">Equipe</span></h2>
        <div class="team-grid">
            <div class="team-member"><span>David</span></div>
            <div class="team-member"><span>Gustavo</span></div>
            <div class="team-member"><span>Alberto</span></div>
            <div class="team-member"><span>Caio</span></div>
        </div>
    </section>
    <section class="card">
        <h2>Sobre a <span class="highlight">Elo Tech</span></h2>
        <p>Somos a <strong>Elo Tech</strong>, focada em IA para segurança digital.</p>
    </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
      </html>
